name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt-arch: linux_gcc_64
            package-dir: ~/.xmake
          - os: windows-latest
            qt-arch: win64_msvc2022_64
            package-dir: ~/AppData/Local/.xmake
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      # Pinned: v4.4.0+ uses the "$/action" self-reference syntax that GitHub runners reject.
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libpulse-dev libjack-jackd2-dev libgl1-mesa-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.package-dir }}
          key: ${{ runner.os }}-xmake-${{ hashFiles('xmake.lua') }}
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: xmake f -m release -y --qt="$QT_ROOT_DIR" --qt_sdkver=6.8.3
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: xmake f -m release -y --qt="$env:QT_ROOT_DIR" --qt_sdkver=6.8.3
      - name: Build
        run: xmake
      - name: Test
        run: xmake test -v
      - name: Smoke test
        run: xmake run wavy-studio --smoke-test
